speak:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    text:
      required: true
      example: "Le facteur est passé."
      selector:
        text:
          multiline: true

notify:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    text:
      selector:
        text:
          multiline: true
    colour:
      selector:
        select:
          options: [warm, amber, rose, violet, blue, green, white]
    level:
      default: 5
      selector:
        number:
          min: 1
          max: 5
          mode: slider
    jingle:
      example: ears
      selector:
        text:
    nose:
      selector:
        select:
          options: ["off", "blink", "double"]
    counter:
      selector:
        number:
          min: 0
          max: 255
          mode: box

jingle:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    jingle:
      required: true
      example: ears
      selector:
        text:

radio:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    station:
      example: fip
      selector:
        text:
    stop:
      selector:
        boolean:

podcast:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    feed:
      example: https://example.org/podcast.rss
      selector:
        text:
          type: url
    episode:
      default: 0
      selector:
        number:
          min: 0
          max: 11
          mode: box
    stop:
      selector:
        boolean:

ears:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    left:
      required: true
      default: 4
      selector:
        number:
          min: 0
          max: 16
          mode: slider
    right:
      required: true
      default: 4
      selector:
        number:
          min: 0
          max: 16
          mode: slider

mail:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    to:
      required: true
      example: nabazprout
      selector:
        text:
    text:
      required: true
      selector:
        text:
          multiline: true
    jingle:
      selector:
        text:

ask:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    question:
      required: true
      example: "Quel temps fait-il à Genève ?"
      selector:
        text:
          multiline: true

listen:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    seconds:
      selector:
        number:
          min: 1
          max: 8
          step: 1
          unit_of_measurement: s

air:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true

ambient:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    colour:
      selector:
        select:
          options:
            - blue
            - sky
            - green
            - red
            - orange
            - violet
            - yellow
            - white
    clear:
      selector:
        boolean:

set_config:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    settings:
      required: true
      example: '{"wake_word": "nabi", "weather_place": "Genève"}'
      selector:
        object:

rfid_bind:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    tag:
      required: true
      example: "04a1b2c3d4e5"
      selector:
        text:
    type:
      required: true
      selector:
        select:
          options:
            - say
            - radio
            - weather
            - webhook
    text:
      selector:
        text:
          multiline: true
    station:
      selector:
        text:
    url:
      selector:
        text:

rfid_remove:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    tag:
      required: true
      selector:
        text:
