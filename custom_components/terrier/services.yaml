speak:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    text:
      required: true
      example: "Le facteur est passé."
      selector:
        text:
          multiline: true

notify:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    text:
      selector:
        text:
          multiline: true
    colour:
      selector:
        select:
          options: [warm, amber, rose, violet, blue, green, white]
    level:
      default: 5
      selector:
        number:
          min: 1
          max: 5
          mode: slider
    jingle:
      example: ears
      selector:
        text:
    nose:
      selector:
        select:
          options: ["off", "blink", "double"]
    counter:
      selector:
        number:
          min: 0
          max: 255
          mode: box

jingle:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    jingle:
      required: true
      example: ears
      selector:
        text:

radio:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    station:
      example: fip
      selector:
        text:
    stop:
      selector:
        boolean:

podcast:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    feed:
      example: https://example.org/podcast.rss
      selector:
        text:
          type: url
    episode:
      default: 0
      selector:
        number:
          min: 0
          max: 11
          mode: box
    stop:
      selector:
        boolean:

ears:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    left:
      required: true
      default: 4
      selector:
        number:
          min: 0
          max: 16
          mode: slider
    right:
      required: true
      default: 4
      selector:
        number:
          min: 0
          max: 16
          mode: slider

mail:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    to:
      required: true
      example: my-friends-rabbit
      selector:
        text:
    text:
      required: true
      selector:
        text:
          multiline: true
    jingle:
      selector:
        text:

ask:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    question:
      required: true
      example: "Quel temps fait-il à Genève ?"
      selector:
        text:
          multiline: true

listen:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    seconds:
      selector:
        number:
          min: 1
          max: 8
          step: 1
          unit_of_measurement: s

air:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true

ambient:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    colour:
      selector:
        select:
          options:
            - blue
            - sky
            - green
            - red
            - orange
            - violet
            - yellow
            - white
    clear:
      selector:
        boolean:

set_config:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    settings:
      required: true
      example: '{"weather_place": "Genève", "voice_speed": "slow"}'
      selector:
        object:

rfid_bind:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    tag:
      required: true
      example: "04a1b2c3d4e5"
      selector:
        text:
    type:
      required: true
      selector:
        select:
          options:
            - say
            - radio
            - weather
            - joke
            - ephemeris
            - transport
            - story
            - agenda
            - webhook
    text:
      selector:
        text:
          multiline: true
    station:
      selector:
        text:
    url:
      selector:
        text:

rfid_remove:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    tag:
      required: true
      selector:
        text:

tell:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    what:
      required: true
      selector:
        select:
          options:
            - joke
            - ephemeris
            - transport
            - story
            - agenda
            - alerts
            - weather
            - clock
            - wakeup
            - twitch

reminder_add:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    at:
      required: true
      example: "08:00"
      selector:
        text:
    text:
      required: true
      example: "Prendre le traitement"
      selector:
        text:
    repeat:
      selector:
        select:
          options:
            - once
            - daily
            - weekdays
            - weekend
    date:
      example: "2026-12-01"
      selector:
        text:
    confirm:
      selector:
        boolean:
    notify:
      example: "a.relative@example.org"
      selector:
        text:

reminder_remove:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: terrier
          multiple: true
    id:
      required: true
      selector:
        text:

