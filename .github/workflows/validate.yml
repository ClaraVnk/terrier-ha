name: Validate

# The two checks that decide whether this is installable at all: hassfest says
# Home Assistant will load it, HACS says HACS will offer it. Neither is
# optional, and both fail loudly rather than warning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Both validators move. A monthly run catches the day one of them starts
    # requiring something new, rather than a user discovering it for us.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hassfest:
    name: Home Assistant will load it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-11-12

  hacs:
    name: HACS will offer it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # No `ignore` any more. The brands check wanted this integration
          # listed in the home-assistant/brands repository, which a custom
          # repository could not do from inside itself — so it was skipped.
          # Since Home Assistant 2026.3 an integration ships its own images
          # in `custom_components/<domain>/brand/`, and local images take
          # priority over the CDN. There is nothing left to submit, so there
          # is nothing left to ignore.

  lint:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install ruff==0.14.14 pytest pyyaml
      - run: ruff check .
      - run: ruff format --check .
      # These need no Home Assistant: they check the things that drift —
      # a service registered but never declared, a translation that lost a
      # key, a colour that does not map back to itself.
      - run: pytest tests -q
